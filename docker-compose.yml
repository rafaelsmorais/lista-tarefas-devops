services:
  database:
    build:
      context: ./database
    container_name: todo-database
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/data/todos.sqlite"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: todo-backend
    environment:
      PORT: 3000
      DATABASE_PATH: /data/todos.sqlite
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/data
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: todo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
